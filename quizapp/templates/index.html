{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Quiz App</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Quiz App</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#" onclick="loadQuestions('python')">Python</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="loadQuestions('django')">Django</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="loadQuestions('html')">HTML</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="loadQuestions('css')">CSS</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="loadQuestions('js')">JavaScript</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="loadQuestions('bootstrap')">Bootstrap</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container mt-4">
    <div id="quiz-area" class="mb-4">
      <h2 id="quiz-title">Loading...</h2>
      <div id="quiz-container"></div>
      <div class="mt-3">
        <button id="submit-btn" class="btn btn-success">Submit</button>
        <button id="retry-btn" class="btn btn-warning ms-2">Try Again</button>
      </div>
    </div>

    <div id="result-area" class="mt-4"></div>
  </div>

  <script src="{% static 'script.js' %}"></script>
</body>
</html>
